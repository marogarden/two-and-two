<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ふたりのプロポーズ</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#080b18;color:#fff;min-height:100vh;overflow-x:hidden}button,input{font:inherit}.screen{display:none;min-height:100vh;padding:28px 18px 34px;align-items:center;justify-content:center}.screen.active{display:flex}.panel{width:min(520px,100%);text-align:center}.logo{font-size:58px;margin-bottom:10px}.title{font-size:30px;font-weight:800;letter-spacing:.04em}.sub{opacity:.72;margin:10px 0 28px}.btn{width:100%;border:0;border-radius:16px;padding:16px;margin:7px 0;font-weight:700;color:#fff;background:#ffffff18;box-shadow:inset 0 0 0 1px #ffffff18;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#ff6fa8,#a66cff)}.btn.danger{background:#4a1824}.input{width:100%;padding:15px;border:1px solid #ffffff25;background:#ffffff0d;color:#fff;border-radius:14px;outline:none;text-align:center;margin:8px 0 18px}.roomcode{font-size:32px;letter-spacing:.25em;font-weight:800;margin:14px 0 28px}.status{padding:14px;border-radius:14px;background:#ffffff0b;margin:8px 0}.scorebar{display:flex;justify-content:space-between;gap:10px;background:#ffffff0b;border-radius:16px;padding:12px 16px;margin:14px 0}.scorebar strong{font-size:22px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}.card{min-height:84px;border:1px solid #ffffff20;border-radius:16px;background:#ffffff0d;color:#fff;padding:14px;font-weight:700;cursor:pointer;transition:.15s}.card.selected{background:#6b4bbd;transform:translateY(-2px);box-shadow:0 8px 24px #0006}.compose{min-height:90px;border:1px dashed #ffffff30;border-radius:16px;padding:16px;margin:14px 0;color:#ddd}.particles{display:flex;gap:7px;overflow:auto;padding:4px 0 12px}.particle{flex:0 0 auto;border:1px solid #ffffff20;background:#ffffff0c;color:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}.mail{font-size:80px;animation:float 2s ease-in-out infinite}.letter{background:#fff;color:#252033;border-radius:18px;padding:26px 20px;margin:24px 0;box-shadow:0 20px 60px #0008}.proposal{font-size:24px;line-height:1.9;font-weight:700;white-space:pre-wrap}.choice{font-size:20px;padding:20px}.marriage{background:radial-gradient(circle at 50% 35%,#6d3c64,#101329 55%,#050611)}.breakup{background:radial-gradient(circle at 50% 35%,#2d1820,#0a0b14 55%,#020207)}.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:72px 72px;opacity:.22;animation:drift 18s linear infinite}.resultIcon{font-size:80px}.resultTitle{font-size:34px;font-weight:800;margin:14px}.small{font-size:13px;opacity:.6}.top{position:absolute;top:18px;right:18px}.gear{border:0;background:#ffffff12;color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer}.setting{display:none;text-align:left;background:#ffffff09;padding:18px;border-radius:18px;margin-top:18px}.setting.open{display:block}.toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0}.wordlist{max-height:180px;overflow:auto}.word{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0c}.word button{border:0;background:none;color:#ff8dab;cursor:pointer}.waiting{padding:22px;border-radius:18px;background:#ffffff09}.winner{font-size:42px;font-weight:900}.error{color:#ff9bb1;margin-top:12px}@keyframes float{50%{transform:translateY(-8px)}}@keyframes drift{to{background-position:72px 72px}}@media(min-width:600px){.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body>
<div id="titleScreen" class="screen active"><div class="panel"><div class="logo">💍</div><div class="title">ふたりのプロポーズ</div><div class="sub">ランダムな言葉だけで、最高のプロポーズを。</div><button class="btn primary" onclick="goName()">はじめる</button></div></div>
<div id="nameScreen" class="screen"><div class="panel"><div class="title">あなたの名前</div><div class="sub">ゲーム中に表示する名前です</div><input id="nameInput" class="input" maxlength="12" placeholder="名前を入力"><button class="btn primary" onclick="saveName()">次へ</button></div></div>
<div id="roomScreen" class="screen"><div class="panel"><div class="title">ルーム</div><button class="btn primary" onclick="createRoom()">＋ ルームを作成</button><div class="sub">または</div><input id="roomInput" class="input" maxlength="8" placeholder="ルームコード"><button class="btn" onclick="joinRoom()">参加する</button><div id="roomInfo"></div><div id="roomError" class="error"></div></div></div>
<div id="gameScreen" class="screen"><button class="gear top" onclick="toggleSettings()">⚙️</button><div class="panel"><div class="title">🎴 プロポーズを作ろう</div><div id="turnInfo" class="sub"></div><div id="scoreBar" class="scorebar"></div><div id="cards" class="cards"></div><div id="compose" class="compose">ここに選んだ言葉が入ります</div><div class="small">助詞は必要なときだけ追加できます</div><div id="particles" class="particles"></div><button class="btn primary" onclick="sendProposal()">💌 送る</button><div id="settings" class="setting"><h3>⚙️ 設定</h3><label>単語を追加</label><input id="customInput" class="input" placeholder="好きな言葉を入力"><button class="btn" onclick="addCustomWord()">＋ 追加</button><div id="wordList" class="wordlist"></div><div class="toggle"><span>🔊 効果音</span><input id="soundToggle" type="checkbox" checked onchange="localStorage.sound=this.checked"></div></div></div></div>
<div id="waitingScreen" class="screen"><div class="panel"><div class="logo">💌</div><div class="title">相手のプロポーズを待っています</div><div id="waitingScore" class="scorebar"></div><div class="waiting">相手が言葉を作っています……</div></div></div>
<div id="revealScreen" class="screen"><div class="stars"></div><div class="panel"><div class="mail">💌</div><div class="sub">あなたに言葉が届きました</div><div class="letter"><div id="receivedProposal" class="proposal"></div></div><button class="btn primary" onclick="showChoices()">開く</button></div></div>
<div id="choiceScreen" class="screen"><div class="panel"><div class="title">あなたの返事は？</div><div id="choiceProposal" class="sub"></div><button class="btn primary choice" onclick="answer('marriage')">💍 結婚する</button><button class="btn danger choice" onclick="answer('breakup')">💔 別れよう</button></div></div>
<div id="resultScreen" class="screen"><div id="resultStars" class="stars"></div><div class="panel"><div id="resultIcon" class="resultIcon"></div><div id="resultTitle" class="resultTitle"></div><div id="resultText" class="sub"></div><div id="resultScore" class="scorebar"></div><button id="nextButton" class="btn primary" onclick="nextRound()">次のラウンド</button></div></div>
<div id="winnerScreen" class="screen"><div class="stars"></div><div class="panel"><div class="resultIcon">🏆</div><div class="winner">ゲーム終了！</div><div id="winnerText" class="title"></div><div id="finalScore" class="scorebar"></div><button class="btn primary" onclick="location.reload()">もう一度遊ぶ</button></div></div>
<script>
const baseWords=['永遠に','マイダーリン','抱きしめる','おばあちゃん','冷蔵庫','宇宙人','それでも','愛しの君','何度でも','そっと','追いかける','運命','奇跡','一生','君','あなた','愛する','守る','そばにいる','生まれ変わっても','未来','最後まで','ちなみに','だから','そして','でも','突然だけど','まったく関係ないけど','お風呂上がり','君の体温','二人きりで','ゴリラ','鳩','味噌汁','焼きそば','パンツ','寝癖','幽霊','死神','ブラックホール','月','火星','未来人'];
const particles=['は','が','を','に','へ','と','で','の','も','や','から','まで','だけ','しか','ね','よ'];
let name='',selected=[],currentCards=[],proposal='',peer=null,conn=null,isHost=false,opponentName='',state={hostScore:0,guestScore:0,round:0,proposer:'host'};
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function sound(type){if(localStorage.sound==='false')return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);let f=type==='send'?520:type==='open'?660:type==='marriage'?880:180;o.frequency.value=f;o.type=type==='breakup'?'sawtooth':'sine';g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+(type==='marriage'?1:.22));o.start();o.stop(c.currentTime+(type==='marriage'?1:.22))}catch(e){}}
function goName(){show('nameScreen')}
function saveName(){name=$('nameInput').value.trim()||'あなた';localStorage.name=name;show('roomScreen')}
function randomCode(){return Math.random().toString(36).slice(2,8).toUpperCase()}
function setupConnection(c){conn=c;conn.on('open',()=>{conn.send({type:'hello',name});$('roomInfo').innerHTML=`<div class="status">🟢 接続しました</div>`;$('roomError').textContent='';startIfReady()});conn.on('data',handleData);conn.on('close',()=>{$('roomError').textContent='相手との接続が切れました。';});conn.on('error',e=>$('roomError').textContent='通信エラー: '+e.type)}
function createRoom(){const code=randomCode();isHost=true;state={hostScore:0,guestScore:0,round:0,proposer:'host'};peer=new Peer(code);peer.on('open',id=>{$('roomInfo').innerHTML=`<div class="status">ROOM CODE</div><div class="roomcode">${id}</div><div class="status">🟢 ${name}<br>⚪ 相手の参加を待っています…</div>`});peer.on('connection',c=>{if(conn)return;setupConnection(c);});peer.on('error',e=>$('roomError').textContent='ルーム作成に失敗しました。別のコードで再試行してください。')}
function joinRoom(){const code=$('roomInput').value.trim().toUpperCase();if(!code){$('roomError').textContent='ルームコードを入力してください。';return}isHost=false;peer=new Peer();peer.on('open',()=>{setupConnection(peer.connect(code,{reliable:true}))});peer.on('error',e=>$('roomError').textContent='ルームが見つかりません。コードを確認してください。')}
function handleData(m){if(m.type==='hello'){opponentName=m.name;conn.send({type:'helloAck',name});if(isHost)startIfReady()}else if(m.type==='helloAck'){opponentName=m.name;startIfReady()}else if(m.type==='roundStart'){state=m.state;beginRound(m.cards,m.proposer)}else if(m.type==='proposal'){proposal=m.proposal;state=m.state;showReveal()}else if(m.type==='answerResult'){state=m.state;showRoundResult(m.answer,m.proposerName,m.scoreForProposer)}else if(m.type==='winner'){state=m.state;showWinner(m.winnerName)}else if(m.type==='nextRequest'){if(isHost){state.proposer=state.proposer==='host'?'guest':'host';startRound()}}}
function startIfReady(){if(!conn||!conn.open)return;if(isHost){setTimeout(()=>startRound(),300)}}
function currentRole(){return state.proposer===(isHost?'host':'guest')?'proposer':'receiver'}
function startRound(){state.round++;const proposer=state.proposer;const cards=dealCards();conn.send({type:'roundStart',state,cards,proposer});beginRound(cards,proposer)}
function dealCards(){const pool=[...baseWords,...customWords()];return [...pool].sort(()=>Math.random()-.5).slice(0,6)}
function beginRound(cards,proposer){selected=[];currentCards=cards;updateScores();if(currentRole()==='proposer'){renderCards();renderParticles();renderCompose();$('turnInfo').textContent='あなたの番。プロポーズを作ってください。';show('gameScreen')}else{$('waitingScore').innerHTML=scoreHtml();show('waitingScreen')}}
function renderCards(){$('cards').innerHTML=currentCards.map((w,i)=>`<button class="card" onclick="toggleCard(${i})">${escapeHtml(w)}</button>`).join('')}
function toggleCard(i){const p=selected.indexOf(i);if(p>=0)selected.splice(p,1);else selected.push(i);document.querySelectorAll('.card').forEach((x,j)=>x.classList.toggle('selected',selected.includes(j)));renderCompose();sound('select')}
function renderCompose(){$('compose').textContent=selected.length?selected.map(i=>currentCards[i]).join(' '):'ここに選んだ言葉が入ります'}
function renderParticles(){$('particles').innerHTML=particles.map(p=>`<button class="particle" onclick="insertParticle('${p}')">${p}</button>`).join('')}
function insertParticle(p){if(!selected.length)return;const cur=$('compose').textContent; $('compose').textContent=(cur==='ここに選んだ言葉が入ります'?'':cur)+p;sound('select')}
function sendProposal(){if(!selected.length){alert('まず言葉を1つ以上選んでください');return}proposal=selected.map(i=>currentCards[i]).join(' ');sound('send');conn.send({type:'proposal',proposal,state,proposerName:name});showWaitingAfterSend()}
function showWaitingAfterSend(){$('waitingScore').innerHTML=scoreHtml();$('waitingScreen').querySelector('.title').textContent='返事を待っています';$('waitingScreen').querySelector('.waiting').textContent='相手が返事を選んでいます……';show('waitingScreen')}
function showReveal(){$('receivedProposal').textContent=proposal;sound('open');show('revealScreen')}
function showChoices(){$('choiceProposal').textContent=proposal;show('choiceScreen')}
function answer(type){sound(type);if(!conn)return;let s={...state};const proposerIsHost=state.proposer==='host';if(type==='marriage'){if(proposerIsHost)s.hostScore++;else s.guestScore++}state=s;conn.send({type:'answerResult',answer:type,state,proposerName:opponentName,scoreForProposer:proposerIsHost?s.hostScore:s.guestScore});if((proposerIsHost?s.hostScore:s.guestScore)>=5){conn.send({type:'winner',state,winnerName:opponentName});showWinner(opponentName)}else showRoundResult(type,opponentName,proposerIsHost?s.hostScore:s.guestScore)}
function showRoundResult(type,proposerName,score){$('resultIcon').textContent=type==='marriage'?'💍':'💔';$('resultTitle').textContent=type==='marriage'?'結婚する':'別れよう';$('resultText').textContent=type==='marriage'?`${proposerName}に「結婚する」が選ばれました！`:`${proposerName}は今回は結婚に届きませんでした。`; $('resultScore').innerHTML=scoreHtml();show('resultScreen')}
function nextRound(){if(!conn)return;if(isHost){state.proposer=state.proposer==='host'?'guest':'host';startRound()}else{conn.send({type:'nextRequest'})}}
function scoreHtml(){const me=isHost?state.hostScore:state.guestScore,opp=isHost?state.guestScore:state.hostScore;return `<span>あなた<br><strong>${me}</strong> / 5</span><span>${escapeHtml(opponentName||'相手')}<br><strong>${opp}</strong> / 5</span>`}
function updateScores(){$('scoreBar').innerHTML=scoreHtml();$('waitingScore').innerHTML=scoreHtml()}
function showWinner(winnerName){$('winnerText').textContent=`🏆 ${winnerName} の勝ち！`;$('finalScore').innerHTML=scoreHtml();show('winnerScreen')}
function customWords(){try{return JSON.parse(localStorage.customWords||'[]')}catch(e){return[]}}
function toggleSettings(){$('settings').classList.toggle('open');renderWords()}
function addCustomWord(){const v=$('customInput').value.trim();if(!v)return;const a=customWords();a.push(v);localStorage.customWords=JSON.stringify(a);$('customInput').value='';renderWords()}
function removeWord(i){const a=customWords();a.splice(i,1);localStorage.customWords=JSON.stringify(a);renderWords()}
function renderWords(){const a=customWords();$('wordList').innerHTML=a.length?a.map((w,i)=>`<div class="word"><span>${escapeHtml(w)}</span><button onclick="removeWord(${i})">削除</button></div>`).join(''):'<div class="small">追加した言葉はありません</div>'}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
if(localStorage.name)$('nameInput').value=localStorage.name;if(localStorage.sound===undefined)localStorage.sound='true';$('soundToggle').checked=localStorage.sound!=='false';
</script></body></html>
